name: Daily Podcast Automation

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install google-cloud-texttospeech boto3

      - name: Generate Audio
        env:
          GCP_TTS_API_KEY: ${{ secrets.GCP_TTS_API_KEY }}
        run: |
          python -m scripts.generate_audio

      - name: Save Audio File
        uses: actions/upload-artifact@v4
        with:
          name: podcast-audio
          path: public/podcast.mp3
